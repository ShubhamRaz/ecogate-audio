# Strong Expert Model Configuration
model:
  model_id: "ecogate_expert_multiscale_ast_v1"
  architecture: "PretrainedOrMultiScaleSpectrogramExpert"
  candidate_evaluated:
    - name: "EfficientNet-B0-Audio / MultiScaleAttentionExpert"
      selected: true
      license: "Apache-2.0"
      rationale: "Balanced compute/accuracy uplift on 3s 32kHz clips with offline/CPU/GPU compatibility"
    - name: "PaSST-S"
      selected: false
      license: "Apache-2.0"
      rationale: "High transformer memory footprint on 6GB VRAM and edge targets"
